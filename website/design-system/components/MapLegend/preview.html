<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MapLegend</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap"></head>
<body>
<div class="dx-panel" style="margin:16px;display:grid;gap:12px;max-width:420px">
  <div class="dx-row"><span class="dx-row" style="gap:6px"><span class="dx-dot grid"></span>Grid</span><span class="dx-row" style="gap:6px"><span class="dx-dot kmeans"></span>K-means</span><span class="dx-row" style="gap:6px"><span class="dx-dot mclp"></span>MCLP</span></div>
  <div class="dx-row"><span class="dx-row" style="gap:6px"><span class="dx-x" aria-hidden="true">×</span>Existing four-wheeler charger</span><span class="dx-row" style="gap:6px"><span class="dx-ring" aria-hidden="true"></span>Shared site</span></div>
  <div><div style="display:flex;height:12px"><span style="flex:1;background:var(--demand-1)"></span><span style="flex:1;background:var(--demand-2)"></span><span style="flex:1;background:var(--demand-3)"></span><span style="flex:1;background:var(--demand-4)"></span><span style="flex:1;background:var(--demand-5)"></span></div>
  <div class="dx-ticks"><span>Lower estimated demand</span><span>Higher</span></div></div>
</div>
</body>
</html>
