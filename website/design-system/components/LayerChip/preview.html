<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LayerChip</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap"></head>
<body>
<div class="dx-row dx-pad" role="group" aria-label="Method layers">
  <button class="dx-chip" aria-pressed="true"><span class="dx-dot grid"></span>Grid<span class="dx-tick" aria-hidden="true">✓</span></button>
  <button class="dx-chip" aria-pressed="true"><span class="dx-dot kmeans"></span>K-means<span class="dx-tick" aria-hidden="true">✓</span></button>
  <button class="dx-chip" aria-pressed="false"><span class="dx-dot mclp"></span>MCLP<span class="dx-tick" aria-hidden="true">✓</span></button>
</div>
</body>
</html>
