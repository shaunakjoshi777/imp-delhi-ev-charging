<!-- @dsCard group="Controls" height=150 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SegmentedControl</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap"></head>
<body>
<div class="dx-col dx-pad">
  <div class="dx-seg" role="radiogroup" aria-label="Scenario">
    <button role="radio" aria-checked="true">A: new network</button>
    <button role="radio" aria-checked="false">B: build on today's 98 chargers</button>
  </div>
  <div class="dx-seg" role="radiogroup" aria-label="View">
    <button role="radio" aria-checked="true">One map</button>
    <button role="radio" aria-checked="false">Side by side</button>
    <button role="radio" aria-checked="false">Shared sites</button>
  </div>
  <div class="dx-seg" role="radiogroup" aria-label="Grid square size">
    <button role="radio" aria-checked="true">3 km</button>
    <button role="radio" aria-checked="false">2 km</button>
    <button role="radio" aria-checked="false" disabled title="Not in the data for this scenario">1 km</button>
  </div>
</div>
</body>
</html>
